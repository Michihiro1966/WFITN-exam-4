name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate question bank
        run: npm run validate

      - name: Smoke-test module resolution and scoring
        run: |
          node -e "
            const { questions, scoreAnswers, publicQuestions } = require('./src/scoring.js');
            require('./src/config.js');
            // A perfect answer set must score full marks regardless of the question bank.
            const perfect = Object.fromEntries(questions.map(q => [String(q.id), q.correct]));
            const r = scoreAnswers(perfect);
            if (r.total !== 40) throw new Error('Expected 40 questions, got ' + r.total);
            if (r.score !== 40) throw new Error('Expected perfect score 40, got ' + r.score);
            // An empty answer set must score zero.
            if (scoreAnswers({}).score !== 0) throw new Error('Empty answers should score 0');
            if (publicQuestions().some(q => q.correct !== undefined)) {
              throw new Error('Answer keys must not be exposed in publicQuestions()');
            }
            console.log('Smoke test passed: scoring and answer-key withholding OK');
          "
